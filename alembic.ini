# Alembic configuration (review 1.4 F-020, review 1.6 F-023).
#
# The database URL is deliberately absent. It carries credentials, and
# build.md §21 keeps those out of the repository — `migrations/env.py` reads
# CRUMBLR_DATABASE_URL from the environment instead, and fails loudly when it
# is unset rather than falling back to something that might be production.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Revision filenames sort chronologically, which is how a human reads a
# migration history even though Alembic itself follows the down_revision chain.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
