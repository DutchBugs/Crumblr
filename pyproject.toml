[project]
name = "crumblr"
version = "0.1.0"
description = "Autonomous EUR/USD trading platform (MetaTrader 5)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The official MetaTrader5 package ships Windows x86-64 wheels only. The marker
# keeps `uv sync` working on the macOS/Linux development hosts, where the MT5
# gateway runs against the fake adapter instead.
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
    "httpx2>=2.12.0",
    # tests/unit/test_mt5_readonly_gateway.py's TestTicks/TestBars numpy
    # regression tests build a real numpy structured array to reproduce
    # D-040 (MT5's copy_ticks_from/copy_rates_from_pos return numpy rows,
    # and numpy 2.x's own scalar repr broke Decimal parsing). numpy was
    # previously only present as a transitive dependency of the `mt5`
    # extra, so these tests silently passed only on hosts that happened to
    # have that extra installed and failed with ModuleNotFoundError
    # everywhere else — including both CI jobs, neither of which installs
    # `mt5` (found 2026-08-26, first real CI run). A dev dependency here
    # keeps this regression test running on every platform, not only where
    # MT5 happens to pull numpy in as a side effect.
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crumblr"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # timezone-aware datetimes
    "T20",       # no print
    "SIM",       # simplify
    "PTH",       # pathlib
    "RUF",
]
# TCH (moving imports into `if TYPE_CHECKING`) is deliberately not selected.
# Pydantic resolves annotations at runtime, so a correctly-moved import becomes
# an import error the moment that type is used as a model field. The import-time
# saving is not worth a runtime failure in a trading process.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["T20"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime to build its validators, so these
# imports must stay out of `if TYPE_CHECKING` blocks.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "crumblr.domain.models.Contract",
    "crumblr.config.ConfigSection",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["MetaTrader5.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "windows_only: requires a Windows host with a running MetaTrader 5 terminal",
    "integration: talks to a real external system (MT5 terminal, PostgreSQL)",
]

[tool.coverage.run]
source = ["src/crumblr"]
branch = true
